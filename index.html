<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatTime • Simple Dual Timezone Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shantell+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-sketch">
  <main class="viewport-wrapper">
    <div class="sketch-card-frame" id="appFrame">

      <!-- ============================================== -->
      <!-- TOP SECTION: SEARCH & TARGET TIMEZONE          -->
      <!-- ============================================== -->
      <section class="card-section top-section" id="topSection">
        
        <!-- Search Bar with Floating Dropdown -->
        <div class="tz-search-wrapper" id="tzSearchWrapper">
          <div class="tz-search-box">
            <span class="tz-search-icon">🔍</span>
            <input 
              type="text" 
              id="tzSearchInput" 
              class="tz-search-input" 
              placeholder="Time zone search" 
              autocomplete="off" 
              spellcheck="false"
            >
            <button id="tzClearBtn" class="tz-clear-btn" title="Clear search" type="button">✕</button>
          </div>

          <!-- Timezone Suggestions Dropdown (Shown ONLY after typing) -->
          <div class="tz-dropdown" id="tzDropdown">
            <div class="tz-dropdown-list" id="tzDropdownList">
              <!-- Dynamically populated when user types (e.g. 'pst', 'ust') -->
            </div>
          </div>
        </div>

        <!-- Selected Zone Tag -->
        <div class="selected-zone-tag" id="topZoneTag" title="Click to search timezone">
          <span class="zone-badge" id="topZoneBadge">PST</span>
          <span class="zone-name" id="topZoneName">Pacific Time (Los Angeles)</span>
          <span class="diff-badge" id="topZoneDiff">-12h 30m</span>
        </div>

        <!-- Upper Time & Date Readout -->
        <div class="time-block" id="topTimeBlock">
          <div class="time-readout-row" id="topTimeRow">
            <input 
              type="text" 
              id="topTimeDigitsInput" 
              class="time-digits-input" 
              value="10:15" 
              placeholder="10:15" 
              inputmode="numeric"
              pattern="[0-9:]*"
              maxlength="5"
              autocomplete="off" 
              spellcheck="false"
              title="Type numbers (e.g. 10:15 or 2:30)"
            >
            <button 
              type="button" 
              id="topPeriodBtn" 
              class="period-toggle-btn" 
              title="Tap to toggle AM / PM"
            >pm</button>
          </div>

          <div class="tappable-date" id="topDateDisplay" title="Tap to change date">
            <span class="date-text" id="topDateText">24 Sept, 2026</span>
          </div>
        </div>

      </section>

      <!-- ============================================== -->
      <!-- CENTER HORIZONTAL DIVIDER LINE                  -->
      <!-- ============================================== -->
      <div class="sketch-divider" id="centerDivider">
        <span class="divider-line"></span>
      </div>

      <!-- ============================================== -->
      <!-- BOTTOM SECTION: INDIAN TIME                     -->
      <!-- ============================================== -->
      <section class="card-section bottom-section" id="bottomSection">
        
        <!-- Label: Indian Time -->
        <div class="indian-label-wrap">
          <h2 class="indian-time-title">Indian Time</h2>
          <span class="ist-badge">IST • UTC+5:30</span>
        </div>

        <!-- Lower Time & Date Readout -->
        <div class="time-block" id="indianTimeBlock">
          <div class="time-readout-row" id="indianTimeRow">
            <input 
              type="text" 
              id="indianTimeDigitsInput" 
              class="time-digits-input" 
              value="10:15" 
              placeholder="10:15" 
              inputmode="numeric"
              pattern="[0-9:]*"
              maxlength="5"
              autocomplete="off" 
              spellcheck="false"
              title="Type Indian time numbers (e.g. 10:15 or 2:30)"
            >
            <button 
              type="button" 
              id="indianPeriodBtn" 
              class="period-toggle-btn" 
              title="Tap to toggle AM / PM"
            >pm</button>
          </div>

          <div class="tappable-date" id="indianDateDisplay" title="Tap to change Indian date">
            <span class="date-text" id="indianDateText">24 Sept, 2026</span>
          </div>
        </div>

      </section>

      <!-- ============================================== -->
      <!-- BOTTOM DIVIDER LINE & TOOLBAR CONTROLS         -->
      <!-- ============================================== -->
      <div class="sketch-divider bottom-divider">
        <span class="divider-line"></span>
      </div>

      <footer class="card-footer-toolbar">
        <button id="syncNowBtn" class="toolbar-btn" title="Reset to current live time">
          <span class="tb-icon">⚡</span>
          <span class="tb-label">Now</span>
        </button>

        <button id="fontToggleBtn" class="toolbar-btn" title="Toggle font between Hand-drawn sketch and Modern clean">
          <span class="tb-icon">✏️</span>
          <span class="tb-label" id="fontToggleLabel">Modern</span>
        </button>

        <button id="soundToggleBtn" class="toolbar-btn" title="Toggle tactile crown sound">
          <span class="tb-icon" id="soundIcon">🔊</span>
          <span class="tb-label" id="soundLabel">Sound</span>
        </button>
      </footer>

    </div>
  </main>

  <!-- ============================================== -->
  <!-- MODAL: DATE PICKER (TAP TO CHANGE DATE)         -->
  <!-- ============================================== -->
  <dialog id="datePickerModal" class="sketch-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="datePickerTitle" class="modal-title">Select Date</h3>
        <button id="datePickerCloseBtn" class="modal-close-x" type="button">✕</button>
      </div>

      <!-- Calendar Month/Year Nav -->
      <div class="calendar-nav-bar">
        <button type="button" id="calPrevBtn" class="cal-nav-arrow" title="Previous Month">‹</button>
        <span id="calCurrentMonthYear" class="cal-nav-title">September 2026</span>
        <button type="button" id="calNextBtn" class="cal-nav-arrow" title="Next Month">›</button>
      </div>

      <!-- Quick Presets -->
      <div class="cal-quick-presets">
        <button type="button" class="preset-chip" id="presetBtnToday">Today</button>
        <button type="button" class="preset-chip" id="presetBtnTomorrow">Tomorrow</button>
        <button type="button" class="preset-chip" id="presetBtnNextWeek">+1 Week</button>
      </div>

      <!-- Weekday Headers -->
      <div class="cal-weekday-labels">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>

      <!-- Calendar Day Cells Grid -->
      <div class="cal-grid" id="calDaysGrid">
        <!-- Generated dynamically via app.js -->
      </div>

      <div class="modal-footer-btns">
        <button type="button" id="datePickerCloseBottomBtn" class="m-btn m-btn-secondary">Close</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
